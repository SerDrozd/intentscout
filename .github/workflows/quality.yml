name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify release contains no known private files
        run: python scripts/check_public_release.py
      - name: Audit all published Git history
        run: python scripts/check_public_history.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy lead_radar
      - name: Tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q lead_radar
